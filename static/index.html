<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Copilot</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2230; --muted:#667085; --accent:#ff9900; --user:#232f3e; --border:#e4e7ec; --tool:#eef4ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --panel:#171b23; --text:#e6e8ec; --muted:#98a2b3; --user:#2d3a4f; --border:#2a303c; --tool:#1b2536; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:1fr 300px; gap:16px; height:100vh; }
  @media (max-width:820px) { .wrap { grid-template-columns:1fr; height:auto; } }
  .chat, .side { background:var(--panel); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; min-height:0; }
  header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:16px; } header span { color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:300px; }
  .msg { max-width:80%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--bg); border:1px solid var(--border); }
  .tool { align-self:flex-start; font:12px ui-monospace, monospace; background:var(--tool); border-radius:8px; padding:6px 10px; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#111; font-weight:600; cursor:pointer; }
  .side section { padding:14px 16px; border-bottom:1px solid var(--border); }
  .side h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; font-size:13px; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .src { font-size:12px; margin-bottom:8px; } .src b { display:block; }
  .chips button { background:var(--bg); color:var(--text); border:1px solid var(--border); font-weight:400; font-size:13px; padding:6px 10px; margin:0 6px 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="chat">
    <header><b>Acme Support Copilot</b><span id="status">connecting…</span></header>
    <div id="log"></div>
    <form id="f"><input id="q" placeholder="Ask about orders, returns, shipping…" autocomplete="off"><button>Send</button></form>
  </div>
  <div class="side">
    <section class="chips"><h3>Try</h3>
      <button>Where is my order A1001?</button><button>How long do refunds take?</button>
      <button>My keyboard from A1003 arrived broken</button><button>Do you ship internationally?</button>
    </section>
    <section><h3>Last turn</h3><dl id="metrics"><dt>—</dt><dd></dd></dl></section>
    <section><h3>Retrieved context</h3><div id="sources" class="src">—</div></section>
  </div>
</div>
<script>
const log = document.getElementById('log'), statusEl = document.getElementById('status');
let ws, bubble = null;

function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

function connect() {
  let sid = null; try { sid = sessionStorage.getItem('sid'); } catch {}
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/chat${sid ? '?session_id=' + sid : ''}`);
  ws.onopen = () => statusEl.textContent = 'live';
  ws.onclose = () => { statusEl.textContent = 'reconnecting…'; setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === 'session') { try { sessionStorage.setItem('sid', e.session_id); } catch {} }
    else if (e.type === 'token') { if (!bubble) bubble = add('bot', ''); bubble.textContent += e.text; log.scrollTop = log.scrollHeight; }
    else if (e.type === 'tool_call') { bubble = null; add('tool', `→ ${e.name}(${JSON.stringify(e.input)})`); }
    else if (e.type === 'tool_result') { add('tool', `${e.is_error ? '✗' : '✓'} ${e.name}: ${JSON.stringify(e.result).slice(0, 140)}`); }
    else if (e.type === 'replace') { (bubble || add('bot', '')).textContent = e.text; }
    else if (e.type === 'sources') {
      const s = document.getElementById('sources'); s.innerHTML = '';
      if (!e.sources.length) s.textContent = 'none';
      e.sources.forEach(x => { const d = document.createElement('div'); d.className = 'src'; const b = document.createElement('b'); b.textContent = `${x.source} · ${x.score}`; d.append(b, x.preview + '…'); s.appendChild(d); });
    }
    else if (e.type === 'error') { add('tool', '⚠ ' + e.message); }
    else if (e.type === 'done') {
      bubble = null; statusEl.textContent = 'live';
      const k = e.metrics, rows = { 'Time to first token': k.ttft_ms + ' ms', 'Total latency': k.latency_ms + ' ms', 'Input tokens': k.input_tokens, 'Cached tokens': k.cache_read_tokens, 'Output tokens': k.output_tokens, 'Tool calls': k.tool_calls, 'Guardrail': k.guardrail };
      document.getElementById('metrics').innerHTML = Object.entries(rows).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
    }
  };
}

function send(text) { if (!text || ws.readyState !== 1) return; add('user', text); bubble = null; statusEl.textContent = 'thinking…'; ws.send(JSON.stringify({ message: text })); }
document.getElementById('f').onsubmit = (ev) => { ev.preventDefault(); const q = document.getElementById('q'); send(q.value.trim()); q.value = ''; };
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => send(b.textContent));
connect();
</script>
</body>
</html>
